name: Build BHTikTokPlusPlus (dylib)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BHTikTokPlusPlus & Upload dylib
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref }}
          path: BHTikTokPlusPlus
          submodules: false   # يتجاوز خطأ FLEXing المفقود

      - name: Install dependencies
        run: brew install make ldid dpkg

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Setup Theos & iOS SDK
        run: |
          # سحب Theos مباشرة بدون التقييد بـ commit محدد
          git clone --recursive https://github.com/theos/theos.git theos
          
          # سحب الـ SDK المناسب
          git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/theos/sdks.git sdks
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout --quiet
          mv *.sdk "$THEOS/sdks"

      - name: Fix Theos od broken pipe issue
        run: sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' $THEOS/bin/convert_xml_plist.sh || true

      - name: Build and Extract Files
        shell: bash
        run: |
          # 1. استخراج رقم الإصدار من ملف control
          VERSION=$(grep '^Version:' BHTikTokPlusPlus/control | cut -d ' ' -f2)
          echo "TWEAK_VERSION=$VERSION" >> $GITHUB_ENV

          # 2. ضغط ملفات السورس كود
          cd ${{ github.workspace }}
          zip -r "BHTikTokPlusPlus_Source_Code_${VERSION}.zip" BHTikTokPlusPlus -x "BHTikTokPlusPlus/.git/*" "BHTikTokPlusPlus/.theos/*" "BHTikTokPlusPlus/packages/*"

          # 3. الانتقال للمجلد للبناء واستخراج ملف dylib
          cd BHTikTokPlusPlus
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          
          DEB_FILE=$(ls packages/*.deb | head -n 1)
          mkdir -p temp_extracted
          dpkg-deb -x "$DEB_FILE" temp_extracted
          FOUND_DYLIB=$(find temp_extracted -name "*.dylib" | head -n 1)
          
          if [ -n "$FOUND_DYLIB" ]; then
            # نسخ ملف dylib إلى المجلد الرئيسي
            cp "$FOUND_DYLIB" "${{ github.workspace }}/BHTikTokPlusPlus.dylib"
          fi
          rm -rf temp_extracted
          make clean

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
         name: BHTikTokPlusPlus v${{ env.TWEAK_VERSION }}
         path: |
           ${{ github.workspace }}/BHTikTokPlusPlus.dylib
           ${{ github.workspace }}/BHTikTokPlusPlus_Source_Code_*.zip
         if-no-files-found: error
         overwrite: true

      - name: Create a draft release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.TWEAK_VERSION }}
          name: v${{ env.TWEAK_VERSION }} - BHTikTokPlusPlus
          files: |
            BHTikTokPlusPlus.dylib
            BHTikTokPlusPlus_Source_Code_*.zip
          draft: true
